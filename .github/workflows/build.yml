name: Native builds

on:
  push:
    branches: [main, ci/native-platforms]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf sdl2
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUMPKINS_PORTABLE_GAME=ON
      - name: Build
        run: cmake --build build/ci --parallel 3
      - name: Launcher smoke test
        run: build/ci/bumpkins --help
      - name: Runtime smoke tests without game assets
        run: ctest --test-dir build/ci --output-on-failure
      - name: Collect executable and notices
        run: |
          mkdir -p dist/LICENSES
          cp build/ci/bumpkins LICENSE README.md RUNNING.md dist/
          cp tools/extract_native_assets.py dist/
          cp LICENSES/* dist/LICENSES/
          if [ "${{ runner.os }}" = macOS ]; then
            test "$(uname -m)" = arm64
            python3 tools/bundle_macos.py --directory dist --test-binary build/ci/runtime-smoke
            otool -L dist/bumpkins
          else
            ldd dist/bumpkins
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openbumpkins-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUMPKINS_PORTABLE_GAME=ON
      - name: Build
        run: cmake --build build/ci --parallel 3
      - name: Launcher smoke test
        run: build/ci/bumpkins.exe --help
      - name: Runtime smoke tests without game assets
        run: ctest --test-dir build/ci --output-on-failure
      - name: Collect executable, dependencies and notices
        run: |
          mkdir -p dist/LICENSES
          cp build/ci/bumpkins.exe LICENSE README.md RUNNING.md dist/
          cp tools/extract_native_assets.py dist/
          cp LICENSES/* dist/LICENSES/
          cp /ucrt64/bin/SDL2.dll /ucrt64/bin/libwinpthread-1.dll /ucrt64/bin/libgcc_s_seh-1.dll dist/
          cp -R /ucrt64/share/licenses/SDL2 /ucrt64/share/licenses/libgcc /ucrt64/share/licenses/libwinpthread dist/LICENSES/
      - name: Verify Windows package without the build environment
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & ./dist/bumpkins.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openbumpkins-windows-x86_64
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
      - name: Create platform archives and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          chmod +x artifacts/openbumpkins-linux-x86_64/bumpkins artifacts/openbumpkins-macos-arm64/bumpkins
          tar -czf "release/openbumpkins-${RELEASE_TAG}-linux-x86_64.tar.gz" -C artifacts openbumpkins-linux-x86_64
          tar -czf "release/openbumpkins-${RELEASE_TAG}-macos-arm64.tar.gz" -C artifacts openbumpkins-macos-arm64
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path('artifacts/openbumpkins-windows-x86_64')
          target = pathlib.Path('release') / ('openbumpkins-' + os.environ['RELEASE_TAG'] + '-windows-x86_64.zip')
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root.parent))
          PY
          cd release
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Native builds for Linux x86-64, Apple Silicon macOS and Windows x86-64.

          Original game data is required and is not included. Each package includes
          RUNNING.md, the resource-extraction tool and license notices.

          macOS and Windows packages include their SDL/runtime libraries. Linux
          requires system SDL2. See RUNNING.md for platform requirements and commands.

          All three builds pass asset-free runtime smoke tests. Windows gameplay
          validation is limited; full campaign playtesting remains ongoing.
          EOF
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "OpenBumpkins $RELEASE_TAG" --notes-file release-notes.md
